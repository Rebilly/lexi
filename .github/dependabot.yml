version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      ignore:
          # TypeScript 7 is the native compiler and has no programmatic API.
          # vue-tsc and @rollup/plugin-typescript still need the TypeScript 6 API.
          - dependency-name: 'typescript'
            versions: ['>= 7.0.0']

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
